<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 130" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="deckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="deckBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.6" />
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <!-- Equalizer Gradient -->
    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="60%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <!-- Shimmer Scanline -->
    <linearGradient id="scanline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      <animate attributeName="x1" from="-100%" to="200%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="300%" dur="3s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    /* Reel rotation */
    @keyframes spinReel {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .reel-left {
      transform-origin: 65px 65px;
      animation: spinReel 4s linear infinite;
    }
    .reel-right {
      transform-origin: 125px 65px;
      animation: spinReel 4s linear infinite;
    }

    /* Equalizer bar bounces */
    @keyframes eq1 { 0%, 100% { height: 8px; y: 72px; } 50% { height: 38px; y: 42px; } }
    @keyframes eq2 { 0%, 100% { height: 32px; y: 48px; } 50% { height: 12px; y: 68px; } }
    @keyframes eq3 { 0%, 100% { height: 18px; y: 62px; } 50% { height: 44px; y: 36px; } }
    @keyframes eq4 { 0%, 100% { height: 40px; y: 40px; } 50% { height: 20px; y: 60px; } }
    @keyframes eq5 { 0%, 100% { height: 14px; y: 66px; } 50% { height: 36px; y: 44px; } }
    @keyframes eq6 { 0%, 100% { height: 28px; y: 52px; } 50% { height: 46px; y: 34px; } }
    @keyframes eq7 { 0%, 100% { height: 42px; y: 38px; } 50% { height: 16px; y: 64px; } }
    @keyframes eq8 { 0%, 100% { height: 22px; y: 58px; } 50% { height: 38px; y: 42px; } }
    @keyframes eq9 { 0%, 100% { height: 35px; y: 45px; } 50% { height: 10px; y: 70px; } }
    @keyframes eq10 { 0%, 100% { height: 16px; y: 64px; } 50% { height: 40px; y: 40px; } }

    .b1 { animation: eq1 0.8s ease-in-out infinite; }
    .b2 { animation: eq2 0.65s ease-in-out infinite; }
    .b3 { animation: eq3 0.9s ease-in-out infinite; }
    .b4 { animation: eq4 0.7s ease-in-out infinite; }
    .b5 { animation: eq5 0.85s ease-in-out infinite; }
    .b6 { animation: eq6 0.6s ease-in-out infinite; }
    .b7 { animation: eq7 0.95s ease-in-out infinite; }
    .b8 { animation: eq8 0.75s ease-in-out infinite; }
    .b9 { animation: eq9 0.8s ease-in-out infinite; }
    .b10 { animation: eq10 0.7s ease-in-out infinite; }

    /* Pulse dot */
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #00f5d4); }
      50% { opacity: 0.35; filter: drop-shadow(0 0 1px #00f5d4); }
    }
    .live-dot { animation: pulseGlow 1.8s ease-in-out infinite; }
  </style>

  <!-- Chassis Frame -->
  <rect width="860" height="130" rx="14" fill="url(#deckBg)" stroke="url(#deckBorder)" stroke-width="1.2" />
  <rect width="860" height="130" rx="14" fill="url(#scanline)" pointer-events="none" />

  <!-- ==================== LEFT: CASSETTE MINI-DECK ==================== -->
  <g transform="translate(18, 20)">
    <!-- Cassette body shell -->
    <rect width="154" height="90" rx="8" fill="#0d131f" stroke="#334155" stroke-width="1" />
    <rect x="8" y="8" width="138" height="74" rx="5" fill="#131b2e" />

    <!-- Center viewing window -->
    <rect x="24" y="24" width="106" height="42" rx="4" fill="#070a12" stroke="#1e293b" stroke-width="1" />

    <!-- Cassette Tape Bridge between reels -->
    <line x1="65" y1="65" x2="125" y2="65" stroke="#475569" stroke-dasharray="2,2" stroke-width="2" />

    <!-- Left Reel (Rotating) -->
    <g class="reel-left">
      <circle cx="65" cy="65" r="14" fill="#1e293b" stroke="#00f5d4" stroke-width="1.5" />
      <circle cx="65" cy="65" r="5" fill="#070a12" />
      <!-- Teeth -->
      <line x1="65" y1="52" x2="65" y2="78" stroke="#00f5d4" stroke-width="1.5" />
      <line x1="52" y1="65" x2="78" y2="65" stroke="#00f5d4" stroke-width="1.5" />
    </g>

    <!-- Right Reel (Rotating) -->
    <g class="reel-right">
      <circle cx="125" cy="65" r="14" fill="#1e293b" stroke="#ff0080" stroke-width="1.5" />
      <circle cx="125" cy="65" r="5" fill="#070a12" />
      <!-- Teeth -->
      <line x1="125" y1="52" x2="125" y2="78" stroke="#ff0080" stroke-width="1.5" />
      <line x1="112" y1="65" x2="138" y2="65" stroke="#ff0080" stroke-width="1.5" />
    </g>

    <!-- Cassette Label text -->
    <text x="77" y="18" fill="#64748b" class="mono" font-size="7.5" font-weight="700" text-anchor="middle" letter-spacing="1.5">RETRO TAPE // TYPE II</text>
  </g>

  <!-- ==================== CENTER: TRACK INFO & TIMELINE ==================== -->
  <g transform="translate(200, 24)">
    <!-- Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="94" height="20" rx="10" fill="#00f5d4" fill-opacity="0.12" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="11" cy="10" r="3.5" fill="#00f5d4" class="live-dot" />
      <text x="21" y="14" fill="#00f5d4" class="mono" font-size="9" font-weight="700" letter-spacing="1">PLAYING</text>
    </g>

    <!-- Audio Format Badges -->
    <g transform="translate(104, 0)">
      <rect width="66" height="20" rx="4" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text x="33" y="14" fill="#94a3b8" class="mono" font-size="8.5" font-weight="600" text-anchor="middle">128 BPM</text>
    </g>
    <g transform="translate(178, 0)">
      <rect width="78" height="20" rx="4" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text x="39" y="14" fill="#94a3b8" class="mono" font-size="8.5" font-weight="600" text-anchor="middle">24-BIT HI-FI</text>
    </g>
    <g transform="translate(264, 0)">
      <rect width="118" height="20" rx="4" fill="#7928ca" fill-opacity="0.2" stroke="#a855f7" stroke-width="1" />
      <text x="59" y="14" fill="#c084fc" class="mono" font-size="8.5" font-weight="600" text-anchor="middle">SYNTH / LO-FI</text>
    </g>

    <!-- Track Title -->
    <text x="0" y="44" fill="#ffffff" class="sans" font-size="16" font-weight="700" letter-spacing="-0.3">Resonance &amp; Chill Beats</text>
    <text x="206" y="44" fill="#94a3b8" class="sans" font-size="13" font-weight="400">— Coding Soundscape</text>

    <!-- Progress / Seek Bar -->
    <g transform="translate(0, 58)">
      <text x="0" y="12" fill="#64748b" class="mono" font-size="9.5">02:48</text>
      <!-- Base bar -->
      <rect x="42" y="5" width="370" height="6" rx="3" fill="#1e293b" />
      <!-- Progress fill -->
      <rect x="42" y="5" width="248" height="6" rx="3" fill="url(#progressGrad)" />
      <!-- Playhead knob -->
      <circle cx="290" cy="8" r="4.5" fill="#ffffff" stroke="#ff0080" stroke-width="2" />
      <text x="422" y="12" fill="#64748b" class="mono" font-size="9.5">04:12</text>
    </g>
  </g>

  <!-- ==================== RIGHT: ANIMATED FREQUENCY EQUALIZER ==================== -->
  <g transform="translate(690, 20)">
    <!-- Equalizer Background Glass -->
    <rect width="148" height="90" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1" />
    <text x="74" y="20" fill="#64748b" class="mono" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1">SPECTRUM ANALYZER</text>

    <!-- 10 Frequency Bars -->
    <g transform="translate(14, 0)">
      <rect class="b1" x="0" y="72" width="7" height="8" rx="2" fill="url(#eqGrad)" />
      <rect class="b2" x="12" y="48" width="7" height="32" rx="2" fill="url(#eqGrad)" />
      <rect class="b3" x="24" y="62" width="7" height="18" rx="2" fill="url(#eqGrad)" />
      <rect class="b4" x="36" y="40" width="7" height="40" rx="2" fill="url(#eqGrad)" />
      <rect class="b5" x="48" y="66" width="7" height="14" rx="2" fill="url(#eqGrad)" />
      <rect class="b6" x="60" y="52" width="7" height="28" rx="2" fill="url(#eqGrad)" />
      <rect class="b7" x="72" y="38" width="7" height="42" rx="2" fill="url(#eqGrad)" />
      <rect class="b8" x="84" y="58" width="7" height="22" rx="2" fill="url(#eqGrad)" />
      <rect class="b9" x="96" y="45" width="7" height="35" rx="2" fill="url(#eqGrad)" />
      <rect class="b10" x="108" y="64" width="7" height="16" rx="2" fill="url(#eqGrad)" />
    </g>
  </g>
</svg>