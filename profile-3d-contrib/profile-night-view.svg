<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39d353"/>
      <stop offset="100%" stop-color="#0e4429"/>
    </linearGradient>
    <linearGradient id="pillar-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56d364"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="860" height="420" rx="12" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Subtle Isometric Grid Base -->
  <g stroke="#21262d" stroke-width="1" opacity="0.6">
    <line x1="130" y1="210" x2="430" y2="360" />
    <line x1="230" y1="160" x2="530" y2="310" />
    <line x1="330" y1="110" x2="630" y2="260" />
    <line x1="430" y1="60"  x2="730" y2="210" />

    <line x1="730" y1="210" x2="430" y2="360" />
    <line x1="630" y1="160" x2="330" y2="310" />
    <line x1="530" y1="110" x2="230" y2="260" />
    <line x1="430" y1="60"  x2="130" y2="210" />
  </g>

  <!-- Isometric Building 1 -->
  <g transform="translate(330, 200)">
    <!-- Top Face -->
    <polygon points="0,-80 50,-105 100,-80 50,-55" fill="url(#pillar-top)" stroke="#39d353" stroke-width="0.8"/>
    <!-- Left Face -->
    <polygon points="0,-80 50,-55 50,20 0,-5" fill="#238636" stroke="#196c2e" stroke-width="0.8"/>
    <!-- Right Face -->
    <polygon points="50,-55 100,-80 100,-5 50,20" fill="#0e4429" stroke="#003820" stroke-width="0.8"/>
  </g>

  <!-- Isometric Building 2 (Tall Central Tower) -->
  <g transform="translate(410, 150)">
    <!-- Top Face -->
    <polygon points="0,-120 50,-145 100,-120 50,-95" fill="#58a6ff" stroke="#79c0ff" stroke-width="0.8"/>
    <!-- Left Face -->
    <polygon points="0,-120 50,-95 50,40 0,15" fill="#1f6feb" stroke="#1158c7" stroke-width="0.8"/>
    <!-- Right Face -->
    <polygon points="50,-95 100,-120 100,15 50,40" fill="#0d419d" stroke="#062b66" stroke-width="0.8"/>
  </g>

  <!-- Isometric Building 3 -->
  <g transform="translate(490, 190)">
    <!-- Top Face -->
    <polygon points="0,-60 50,-85 100,-60 50,-35" fill="url(#neon-green)" stroke="#39d353" stroke-width="0.8"/>
    <!-- Left Face -->
    <polygon points="0,-60 50,-35 50,30 0,5" fill="#2ea043" stroke="#238636" stroke-width="0.8"/>
    <!-- Right Face -->
    <polygon points="50,-35 100,-60 100,5 50,30" fill="#0e4429" stroke="#09311e" stroke-width="0.8"/>
  </g>

  <!-- Isometric Building 4 (Foreground Accent) -->
  <g transform="translate(370, 240)">
    <!-- Top Face -->
    <polygon points="0,-40 40,-60 80,-40 40,-20" fill="#39d353" stroke="#56d364" stroke-width="0.8"/>
    <!-- Left Face -->
    <polygon points="0,-40 40,-20 40,20 0,0" fill="#238636" stroke="#196c2e" stroke-width="0.8"/>
    <!-- Right Face -->
    <polygon points="40,-20 80,-40 80,0 40,20" fill="#0e4429" stroke="#062b16" stroke-width="0.8"/>
  </g>

  <!-- Terminal HUD Header -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="430" y="55" font-size="16" font-weight="700" fill="#58a6ff" text-anchor="middle" letter-spacing="2">
      3D ISOMETRIC CONTRIBUTION SKYLINE
    </text>
    <text x="430" y="80" font-size="12" fill="#8b949e" text-anchor="middle">
      Compiling commit architecture &amp; metropolitan grid via GitHub Actions...
    </text>
  </g>

  <!-- Terminal Status Pill -->
  <g transform="translate(340, 370)">
    <rect width="180" height="28" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="14" r="4" fill="#39d353" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="35" y="19" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#39d353">
      INITIALIZING SKYLINE
    </text>
  </g>
</svg>
