name: Update profile art

# Refreshes contribution graph, retro snake game, stats card, and 3D skyline daily.
# Runs daily, plus whenever you push to main, plus on-demand.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: rajashekharexe

      - name: Render animated contribution graph SVG
        run: python scripts/generate_streak_svg.py rajashekharexe contrib-heatmap.svg

      - name: Render streak / numbers card
        run: python scripts/render_stats_svg.py

      - name: Generate Snake Animation Files
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rajashekharexe
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate 3D Contribution Skyline
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: rajashekharexe

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph, snake game & 3D skyline [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg github-contribution-grid-snake*.svg profile-3d-contrib/*"
