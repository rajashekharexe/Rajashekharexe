<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for canvas -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#11151c" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .card { transition: transform 0.2s ease, stroke 0.2s ease; }
    .card:hover { transform: translateY(-2px); }
  </style>

  <!-- Canvas Frame -->
  <rect width="860" height="180" rx="12" fill="url(#canvasBg)" stroke="#30363d" stroke-width="1" />

  <!-- ================================================================= -->
  <!-- CARD 1: MICROSOFT AZURE AI (FIRST)                                -->
  <!-- ================================================================= -->
  <g transform="translate(16, 16)" class="card">
    <!-- Card Frame -->
    <rect width="264" height="148" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1" />
    <!-- Azure Top Accent Border -->
    <path d="M 0 8 Q 0 0 8 0 L 256 0 Q 264 0 264 8 L 264 10 L 0 10 Z" fill="#0078d4" />

    <!-- Microsoft 4-Square Official Logo -->
    <g transform="translate(18, 22)">
      <rect x="0" y="0" width="9.5" height="9.5" fill="#f25022" rx="0.5" />
      <rect x="11.5" y="0" width="9.5" height="9.5" fill="#7fba00" rx="0.5" />
      <rect x="0" y="11.5" width="9.5" height="9.5" fill="#00a4ef" rx="0.5" />
      <rect x="11.5" y="11.5" width="9.5" height="9.5" fill="#ffb900" rx="0.5" />
    </g>

    <!-- Verified Pill Badge -->
    <g transform="translate(164, 21)">
      <rect width="82" height="20" rx="10" fill="#033a16" fill-opacity="0.6" stroke="#238636" stroke-width="1" />
      <circle cx="10" cy="10" r="3" fill="#3fb950" />
      <text x="20" y="13.5" fill="#3fb950" class="mono" font-size="9" font-weight="700" letter-spacing="0.5">VERIFIED</text>
    </g>

    <!-- Title & Subtitle -->
    <text x="18" y="66" fill="#58a6ff" class="sans" font-size="15" font-weight="700">Microsoft Certified</text>
    <text x="18" y="86" fill="#f0f6fc" class="sans" font-size="13" font-weight="600">Azure AI Developer</text>

    <!-- Credential Details -->
    <text x="18" y="108" fill="#8b949e" class="sans" font-size="11" font-weight="400">Apps &amp; AI Agents Associate</text>
    <text x="18" y="128" fill="#6e7681" class="mono" font-size="9.5">ID: BDA7BFE0C929AE66</text>
    <text x="18" y="142" fill="#58a6ff" class="mono" font-size="8.5">Microsoft Learn Verified</text>
  </g>

  <!-- ================================================================= -->
  <!-- CARD 2: IEEE GAMEATHON (SECOND)                                  -->
  <!-- ================================================================= -->
  <g transform="translate(298, 16)" class="card">
    <!-- Card Frame -->
    <rect width="264" height="148" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1" />
    <!-- Gold Top Accent Border -->
    <path d="M 0 8 Q 0 0 8 0 L 256 0 Q 264 0 264 8 L 264 10 L 0 10 Z" fill="#d29922" />

    <!-- Vector Medal Icon -->
    <g transform="translate(18, 20)">
      <!-- Ribbon Tails -->
      <path d="M4 1 L1 12 L5 10 L9 12 L6 1 Z" fill="#9e6a03" />
      <path d="M14 1 L11 12 L15 10 L19 12 L16 1 Z" fill="#d29922" />
      <!-- Medal Coin -->
      <circle cx="10" cy="13" r="8" fill="#161b22" stroke="#e3b341" stroke-width="1.8" />
      <text x="10" y="16.5" fill="#e3b341" class="sans" font-size="9.5" font-weight="900" text-anchor="middle">2</text>
    </g>

    <!-- Placement Badge -->
    <g transform="translate(158, 21)">
      <rect width="88" height="20" rx="10" fill="#2d1d03" fill-opacity="0.6" stroke="#9e6a03" stroke-width="1" />
      <text x="44" y="13.5" fill="#f0883e" class="mono" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">2ND PLACE</text>
    </g>

    <!-- Title & Subtitle -->
    <text x="18" y="66" fill="#e3b341" class="sans" font-size="15" font-weight="700">IEEE GAMEATHON</text>
    <text x="18" y="86" fill="#f0f6fc" class="sans" font-size="13" font-weight="600">Game Architecture Winner</text>

    <!-- Competition Details -->
    <text x="18" y="108" fill="#8b949e" class="sans" font-size="11" font-weight="400">Interactive Simulation &amp; Logic</text>
    <text x="18" y="128" fill="#6e7681" class="mono" font-size="9.5">IEEE Computer Society</text>
    <text x="18" y="142" fill="#d29922" class="mono" font-size="8.5">Competitive Game Dev</text>
  </g>

  <!-- ================================================================= -->
  <!-- CARD 3: IEEE AI ARENA 2.0 (THIRD)                                -->
  <!-- ================================================================= -->
  <g transform="translate(580, 16)" class="card">
    <!-- Card Frame -->
    <rect width="264" height="148" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1" />
    <!-- Emerald Top Accent Border -->
    <path d="M 0 8 Q 0 0 8 0 L 256 0 Q 264 0 264 8 L 264 10 L 0 10 Z" fill="#238636" />

    <!-- Vector Trophy Cup -->
    <g transform="translate(18, 20)" stroke="#3fb950" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 2 h13 v5 c0 3.6 -2.9 6.5 -6.5 6.5 S4 10.6 4 7 Z" stroke-width="1.6" />
      <path d="M4 4 H1.5 c0 2.2 1.4 4 3 4.4" stroke-width="1.3" />
      <path d="M17 4 h2.5 c0 2.2 -1.4 4 -3 4.4" stroke-width="1.3" />
      <path d="M10.5 13.5 v4 M7 17.5 h7" stroke-width="1.5" />
    </g>

    <!-- Rank Badge -->
    <g transform="translate(170, 21)">
      <rect width="76" height="20" rx="10" fill="#042612" fill-opacity="0.6" stroke="#238636" stroke-width="1" />
      <text x="38" y="13.5" fill="#3fb950" class="mono" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">TOP 6%</text>
    </g>

    <!-- Title & Subtitle -->
    <text x="18" y="66" fill="#3fb950" class="sans" font-size="15" font-weight="700">IEEE AI Arena 2.0</text>
    <text x="18" y="86" fill="#f0f6fc" class="sans" font-size="13" font-weight="600">4th Place / 69 Teams</text>

    <!-- Hackathon Details -->
    <text x="18" y="108" fill="#8b949e" class="sans" font-size="11" font-weight="400">Full-Stack AI Educational App</text>
    <text x="18" y="128" fill="#6e7681" class="mono" font-size="9.5">National Hackathon Finalist</text>
    <text x="18" y="142" fill="#3fb950" class="mono" font-size="8.5">Hackathon Architecture</text>
  </g>
</svg>